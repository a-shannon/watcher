---
api:
  port: 'SERVICE_PORT'
  apiKeyHash: 'API_KEY_HASH'
database:
  host: 'POSTGRES_HOST'
  port: 'POSTGRES_PORT'
  user: 'POSTGRES_USER'
  password: 'POSTGRES_PASSWORD'
  name: 'POSTGRES_DB'
ergo:
  mnemonic: 'MNEMONIC'
bitcoin:
  rpc:
    username: 'BITCOIN_RPC_USERNAME'
    password: 'BITCOIN_RPC_PASSWORD'
bitcoinRunes:
  unisat:
    apiKey: 'UNISAT_API_KEY'
  ordiscan:
    apiKey: 'ORDISCAN_API_KEY'
cardano:
  koios:
    authToken: 'KOIOS_AUTH_TOKEN'
  blockfrost:
    projectId: 'BLOCKFROST_PROJECT_ID'
ethereum:
  rpc:
    authToken: 'ETHEREUM_RPC_AUTH_TOKEN'
avalanche:
  chainId:
    __name: 'AVALANCHE_CHAIN_ID'
    __format: 'number'
  sourceId: 'AVALANCHE_SOURCE_ID'
  healthCheck:
    blockTime:
      __name: 'AVALANCHE_HEALTH_CHECK_BLOCK_TIME'
      __format: 'number'
  initial:
    height:
      __name: 'AVALANCHE_INITIAL_HEIGHT'
      __format: 'number'
  interval:
    __name: 'AVALANCHE_SCANNER_INTERVAL'
    __format: 'number'
  rpc:
    url: 'AVALANCHE_RPC_URL'
    timeout:
      __name: 'AVALANCHE_RPC_TIMEOUT'
      __format: 'number'
    authToken: 'AVALANCHE_RPC_AUTH_TOKEN'
observation:
  validThresholdBlocks:
    __name: 'AVALANCHE_OBSERVATION_VALID_THRESHOLD_BLOCKS'
    __format: 'number'
binance:
  rpc:
    authToken: 'BINANCE_RPC_AUTH_TOKEN'
firo:
  rpc:
    username: 'FIRO_RPC_USERNAME'
    password: 'FIRO_RPC_PASSWORD'
  electrumx:
    port: 'FIRO_ELECTRUMX_PORT'
handshake:
  rpc:
    username: 'HANDSHAKE_RPC_USERNAME'
    password: 'HANDSHAKE_RPC_PASSWORD'
overrideLokiBasicAuth: 'OVERRIDE_LOKI_BASIC_AUTH'
